<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <style>
      h3 {
        text-align: right;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 200%;
        color: darkgreen;
      }
      p.welcome {
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        word-spacing: 3px;
      }
      table,
      td,
      th {
        border: 2px solid black;
        border-collapse: collapse;
        width: 60%;
        text-align: center;
        vertical-align: middle;
      }
      a {
        margin: 3px;
        text-decoration: none;
      }
      a:hover {
        color: brown;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="">Our Story</a>
      <a href="">Book a table</a>
      <a href="">Contact Us</a>
    </nav>
    <!-- Icons below -->

    <i class="material-icons">add</i>
    <i class="material-icons">search</i>

    <h3>The Saffron Bistro</h3>
    <p class="welcome">
      Experience artisanal culinary delights crafted with passion
    </p>
    <table>
      <tr>
        <th>Chef's Special Item</th>
        <th>Chef's Special Item</th>
      </tr>
      <tr>
        <td>Pan-Seared Truffle Salmon</td>
        <td>$28.50</td>
      </tr>
      <tr>
        <td>Wild Mushroom Risotto</td>
        <td>$22.00</td>
      </tr>
      <tr>
        <td>Deconstructed Tiramisu</td>
        <td>$12.50</td>
      </tr>
    </table>
  </body>
</html>
